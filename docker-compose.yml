services:
  postgres:
    image: postgres:16-alpine
    container_name: vortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex123
      POSTGRES_DB: vortex_marketplace
    ports:
      - "5432:5432"
    volumes:
      - vortex_pgdata:/var/lib/postgresql/data

volumes:
  vortex_pgdata:
